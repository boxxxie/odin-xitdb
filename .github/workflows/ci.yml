name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout hugi v0.1.2 (runner only)
        uses: actions/checkout@v4
        with:
          repository: boxxxie/hugi
          ref: v0.1.2
          path: .tmp/hugi
          persist-credentials: false

      - name: Checkout temple
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: boxxxie/temple
          ref: master
          path: .tmp/temple
          persist-credentials: false

      - name: Init hugi obench submodule
        run: git -C .tmp/hugi submodule update --init deps/obench

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LuaJIT (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev

      - name: Install LuaJIT (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install luajit
          echo "LIBRARY_PATH=$(brew --prefix luajit)/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix luajit)/lib" >> $GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build LuaJIT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git C:\luajit
          powershell -NoProfile -Command "(Get-Content C:\luajit\src\lj_err.c) -replace '0xe24c4a00', '0x624c4a00' | Set-Content C:\luajit\src\lj_err.c"
          cd /d C:\luajit\src
          call msvcbuild.bat
          copy /Y C:\luajit\src\lua51.dll "%GITHUB_WORKSPACE%\lua51.dll"
          copy /Y C:\luajit\src\lua51.lib "%GITHUB_WORKSPACE%\lua51.lib"
          echo LIB=C:\luajit\src;%GITHUB_WORKSPACE%;%LIB%>> "%GITHUB_ENV%"
          echo C:\luajit\src>> "%GITHUB_PATH%"

      - name: Check library package syntax & types
        run: |
          odin check xitdb/luajit -no-entry-point
          odin check xitdb -no-entry-point
          odin check cmd/xit

      - name: Check benchmark suite syntax & types
        run: odin check benchmarks -collection:hugi=.tmp/hugi/hugi -collection:obench=.tmp/hugi/deps/obench/obench -vet -warnings-as-errors

      - name: Verify temple benchmark renderer (Linux)
        if: runner.os == 'Linux'
        run: |
          odin run .tmp/temple/cli -- --check --warn-unused benchmarks/render -out:benchmarks/render/templates_gen.odin -pkg:bench_render -temple-import:temple:.
          odin check benchmarks/render -collection:temple=.tmp/temple -vet -strict-style -vet-tabs -warnings-as-errors -vet-packages:bench_render
          odin test benchmarks/render -collection:temple=.tmp/temple -vet -strict-style -vet-tabs -warnings-as-errors -vet-packages:bench_render -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Strict static checks (Linux)
        if: runner.os == 'Linux'
        run: |
          odin check xitdb -no-entry-point -vet -warnings-as-errors
          odin check cmd/xit -vet -warnings-as-errors
          odin check tests -no-entry-point -warnings-as-errors
          odin check fuzz/dsl -collection:xitdb=./xitdb -no-entry-point -vet -warnings-as-errors
          odin check fuzz/wire -collection:xitdb=./xitdb -no-entry-point -vet -warnings-as-errors
          odin check fuzz/lua -collection:xitdb=./xitdb -no-entry-point -vet -warnings-as-errors
          odin doc xitdb > /dev/null

      - name: Run ATDD specification suite
        run: odin test tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true
