) or_return\n\t\t\tfor i in 0 ..< 200 {\n\t\t\t\txitdb.sorted_map_put(&sm, fmt.tprintf(\"skey-%04d\", (i * 73) % 200), u64(i)) or_return\n\t\t\t}\n\t\t\tsm_slot := xitdb.sorted_map_slot(sm.read_sorted_map) or_return\n\n\t\t\t// 4. DAG structural sharing: reference the same 3 collections under 5 alias keys each\n\t\t\tfor alias_i in 0 ..< 5 {\n\t\t\t\txitdb.hash_map_put(&root_map, fmt.tprintf(\"alias-al-%d\", alias_i), al_slot) or_return\n\t\t\t\txitdb.hash_map_put(&root_map, fmt.tprintf(\"alias-lal-%d\", alias_i), lal_slot) or_return\n\t\t\t\txitdb.hash_map_put(&root_map, fmt.tprintf(\"alias-sm-%d\", alias_i), sm_slot) or_return\n\t\t\t}\n\t\t\treturn nil\n\t\t}\n\n\t\t_ = xitdb.database_run_context(&dag_db, build_dag_cb, nil)\n\n\t\tdag_dst_core: xitdb.Core = xitdb.core_memory_init()\n\t\tdefer xitdb.core_destroy(&dag_dst_core)\n\t\tdag_om: xitdb.Offset_Map = xitdb.memory_offset_map_init()\n\t\tdefer xitdb.offset_map_destroy(&dag_om)\n\n\t\tt_dag := time.now()\n\t\tdag_comp_db, _ := xitdb.database_compact(&dag_db, &dag_dst_core, &dag_om)\n\t\telapsed_dag := time.since(t_dag)\n\t\tdag_comp_sz, _ := xitdb.database_committed_size(&dag_comp_db)\n\n\t\tprint_result(Bench_Result{\n\t\t\tname       = \"Compaction (Heterogeneous DAG + dedup)\",\n\t\t\tops        = 1,\n\t\t\telapsed    = elapsed_dag,\n\t\t\tbytes_used = dag_comp_sz,\n\t\t})", "odin_start": 1462, "procs_count": 152, "files_count": 8, "lines_count": 3870, "reached_procs": ["core_memory_init", "core_destroy", "database_init", "sha1_hasher", "write_counted_hash_map_init", "hash_map_put_cursor", "write_array_list_init", "array_list_append", "array_list_slot", "write_linked_array_list_init", "linked_array_list_append", "linked_array_list_slot", "write_sorted_map_init", "sorted_map_put", "sorted_map_slot", "hash_map_put", "database_run_context", "memory_offset_map_init", "offset_map_destroy", "database_compact", "_buffered_flush", "core_seek_to", "core_length", "_random_u64", "header_write", "root_header_to_bytes" [col_i] = true\n\t\t\t\t} else if cmp, ok := _compare_pull_values(val, b.max_vals[col_i]); ok && cmp > 0 {\n\t\t\t\t\tb.max_vals[col_i] = val\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\n\t// If global aggregation (no group-by keys) matched 0 rows and only `count`/`sum` are requested, return 1 zeroed row\n\tif len(buckets) == 0 && !has_group_keys {\n\t\tonly_count_or_sum := true\n\t\tfor item in q.find_items {\n\t\t\tif item.agg != .Count && item.agg != .Sum {\n\t\t\t\tonly_count_or_sum = false\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t\tif only_count_or_sum {\n\t\t\tappend(&buckets, _Datalog_Group_Bucket{})\n\t\t}\n\t}\n\n\trows := make([][]Pull_Value, len(buckets), allocator)\n\tfor &b, r_idx in buckets {\n\t\trow := make([]Pull_Value, len(q.find_items), allocator)\n\t\tfor item, col_i in q.find_items {\n\t\t\tswitch item.agg {\n\t\t\tcase .None:\n\t\t\t\trow[col_i] = b.key_env.vals[item.var_idx]\n\t\t\tcase .Count:\n\t\t\t\trow[col_i] = b.counts[col_i]\n\t\t\tcase .Sum:\n\t\t\t\tif b.sum_kind[col_i] == 2 {\n\t\t\t\t\trow[col_i] = b.sum_f64[col_i] + f64(b.sum_i64[col_i]) + f64(b.sum_u64[col_i])\n\t\t\t\t} else if b.sum_kind[col_i] == 1 {\n\t\t\t\t\trow[col_i] = b.sum_i64[col_i] + i64(b.sum_u64[col_i])\n\t\t\t\t} else {\n\t\t\t\t\trow[col_i] = b.sum_u64[col_i]\n\t\t\t\t}\n\t\t\tcase .Min:\n\t\t\t\trow[col_i] = b.min_vals[col_i]\n\t\t\tcase .Max:\n\t\t\t\trow[col_i] = b.max_vals[col_i]\n\t\t\t}\n\t\t}\n\t\trows[r_idx] = row\n\t}\n\treturn rows\n}", "callees": ["_pull_value_equals", "_compare_pull_values"]}, "_eval_datalog_clauses": {"name": "_eval_datalog_clauses", "file": "xitdb/dsl.odin", "start_line": 3199, "end_line": 3252, "code": "@(private = \"file\")\n_eval_datalog_clauses :: proc(\n\tdb: ^Database,\n\tq: ^Datalog_Query,\n\tclause_idx: int,\n\tdefault_moment: i64,\n\tenv: Datalog_Env,\n\tout_rows: ^[dynamic][]Pull_Value,\n\tout_envs: ^[dynamic]Datalog_Env,\n\tstop_after_first: bool,\n\tallocator: runtime.Allocator,\n) -> (matched_any: bool, err: Error) {\n\tif clause_idx >= l dge == nil {\n\t\treturn false, nil\n\t}\n\n\t// Build a 1-clause helper query to step `clause.reach_edge^`\n\tstep_q := Datalog_Query{\n\t\tvar_names  = q.var_names,\n\t\tvar_count  = q.var_count,\n\t\tfind_items = make([dynamic]Datalog_Find_Item, 1, 1, allocator),\n\t\tclauses    = make([dynamic]Datalog_Clause, 1, 1, allocator),\n\t\tallocator  = allocator,\n\t}\n\tstep_q.clauses[0] = clause.reach_edge^\n\n\t// 1. Resolve starting `from` seed(s)\n\tseeds := make([dynamic]Pull_Value, 0, 4, allocator)\n\tif env.bound[clause.reach_from_var] {\n\t\tappend(&seeds, env.vals[clause.reach_from_var])\n\t} else {\n\t\tstep_q.find_items[0] = Datalog_Find_Item{agg = .None, var_idx = clause.reach_from_var}\n\t\tseed_rows := make([dynamic][]Pull_Value, 0, 8, allocator)\n\t\tseed_env := env\n\t\tseed_env.bound[clause.reach_from_var] = false\n\t\tseed_env.bound[clause.reach_to_var] = false\n\t\t_ = _eval_pattern_moment(db, &step_q, clause.reach_edge^, 0, default_moment, seed_env, &seed_rows, nil, false, allocator) or_return\n\t\tfor sr in seed_rows {\n\t\t\tif !_pull_slice_contains(seeds[:], sr[0]) {\n\t\t\t\tappend(&seeds, sr[0])\n\t\t\t}\n\t\t}\n\t}\n\n\tstep_q.find_items[0] = Datalog_Find_Item{agg = .None, var_idx = clause.reach_to_var}\n\n\t// 2. For each seed, run cycle-safe BFS\n\tfor seed in seeds {\n\t\tvisited := make([dynamic]Pull_Value, 0, 8, allocator)\n\t\tqueue := make([dynamic]_Reach_Queue_Item, 0, 8, allocator)\n\t\tappend(&queue, _Reach_Queue_Item{node = seed, depth = 0})\n\n\t\tq_head := 0\n\t\tfor q_head < len(queue) {\n\t\t\tcurr := queue[q_head]\n\t\t\tq_head += 1\n\n\t\t\tedge_env := env\n\t\t\tedge_env.bound[clause.reach_from_var] = true\n\t\t\tedge_env.vals[clause.reach_from_var] = curr.node\n\t\t\tedge_env.bound[clause.reach_to_var] = false\n\n\t\t\tneighbor_rows := make([dynamic][]Pull_Value, 0, 4, allocator)\n\t\t\t_ = _eval_pattern_moment(db, &step_q, clause.reach_edge^, 0, default_moment, edge_env, &neighbor_rows, nil, false, allocator) or_return\n\n\ let activeIdx = 0;

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderList() {
  const q = document.getElementById("search").value.toLowerCase();
  const el = document.getElementById("bench-list");
  el.innerHTML = BENCHMARKS.map((b, i) => {
    if (q && !b.name.toLowerCase().includes(q)) return "";
    const cls = i === activeIdx ? "bench-item active" : "bench-item";
    return `<div class="${cls}" onclick="selectBench(${i})">
      <strong>#${b.rank}</strong> ${escapeHtml(b.name)}<br>
      <span class="badge">${b.procs_count} procs · ${b.files_count} files · ${b.lines_count} LOC</span>
    </div>`;
  }).join("");
}

function selectBench(idx) {
  activeIdx = idx;
  renderList();
  const b = BENCHMARKS[idx];
  const reached = new Set(b.reached_procs);
  const byFile = {};
  for (const pname of b.reached_procs) {
    const p = PROCS[pname];
    if (!byFile[p.file]) byFile[p.file] = [];
    byFile[p.file].push(p);
  }
  let html = `<h2>#${b.rank}. ${escapeHtml(b.name)}</h2>
    <p><a href="${b.slug}.md">Markdown Slice (${b.slug}.md)</a> ·
       <a href="${b.odin_url}">Odin Harness</a>
       ${b.zig_url ? ` · <a href="${b.zig_url}">Zig Harness</a>` : ""}</p>
    <h3>Benchmark Harness (bench_xitdb.odin)</h3>
    <pre>${escapeHtml(b.odin_snippet)}</pre>
    <h3>Touched Library Code (${b.procs_count} procedures across ${b.files_count} xitdb/*.odin files)</h3>`;
  for (const [file, procs] of Object.entries(byFile)) {
    procs.sort((a, c) => a.start_line - c.start_line);
    html += `<h4>${file} (${procs.length} procedures)</h4>`;
    for (const p of procs) {
      const d = b.depths[p.name];
      const badgeCls = d === 0 ? "badge entry" : "badge";
      const badgeTxt = d === 0 ? "ENTRY POINT" : `DEPTH ${d}`;
      html += `<div class="proc-card">
        <div><strong>${p.name}</strong> <span class="${badgeCls}">${badgeTxt}</span>
        <span class="badge">L${p.start_line}–L${p.end_line}</span></div>
        <pre>${escapeHtml(p.code)}</pre>
      </div>`;
    }
  }
  document.getElementById("content").innerHTML = html;
}

renderList();
if (BENCHMARKS.length > 0) selectBench(0);
</script>
